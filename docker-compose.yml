services:
  db:
    image: postgres:16-alpine
    container_name: colmena_db
    environment:
      POSTGRES_DB: colmena_belleza
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: colmena_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/colmena_belleza
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: colmena_frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  db-data:
